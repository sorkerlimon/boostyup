<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}boostupme{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        font-family: "Inter", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }
    </style>
  </head>
  <body class="bg-[#f5f1ed] text-slate-800">
    <div class="min-h-screen">
      <!-- top navigation -->
      {% include "navbar.html" %}

      {% block content %}{% endblock %}

      {% include "footer.html" %}
    </div>

    <div id="chat-panel" class="fixed bottom-24 right-6 z-50 hidden w-72 max-w-sm rounded-3xl bg-white shadow-2xl shadow-orange-500/20 ring-1 ring-orange-100">
      <div class="flex items-center justify-between rounded-t-3xl bg-gradient-to-r from-orange-500 to-pink-500 px-5 py-4 text-white">
        <div>
          <p class="text-sm font-semibold">boostupme Support</p>
          <p class="text-xs text-white/80">Typically replies within minutes</p>
        </div>
        <button id="chat-close" aria-label="Close chat" class="rounded-full bg-white/20 p-1 transition hover:bg-white/30">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
      <div class="space-y-4 px-5 py-4">
        <div class="space-y-2 text-sm">
          <div class="w-fit rounded-2xl bg-orange-50 px-4 py-2 text-orange-600">Hi! Need help picking the right top-up?</div>
        </div>
        <ul id="chat-log" class="max-h-40 space-y-2 overflow-y-auto pr-1 text-sm text-gray-700"></ul>
        <form id="chat-form" class="flex items-center gap-2">
          <input id="chat-input" type="text" placeholder="Type your message..." class="w-full rounded-2xl border border-gray-200 bg-gray-50 px-3 py-2 text-sm focus:border-orange-500 focus:bg-white focus:outline-none focus:ring-1 focus:ring-orange-500" />
          <button type="submit" class="rounded-2xl bg-gradient-to-r from-orange-500 to-pink-500 px-3 py-2 text-xs font-semibold uppercase tracking-wide text-white transition hover:from-orange-600 hover:to-pink-600">Send</button>
        </form>
      </div>
    </div>

    <button
      data-chat-toggle
      aria-label="Live chat support"
      class="group fixed bottom-6 right-6 z-50 flex h-14 w-14 items-center justify-center rounded-full bg-gradient-to-br from-orange-500 via-pink-500 to-purple-500 text-white shadow-2xl shadow-orange-500/30 transition hover:scale-105 focus:outline-none focus:ring-4 focus:ring-orange-200/60"
    >
      <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 transition group-hover:scale-110" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9.75h7.5m-7.5 3h3.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-6 6 3.5 2" />
      </svg>
    </button>

    <script>
      (() => {
        const panel = document.getElementById("chat-panel");
        const toggleButtons = document.querySelectorAll("[data-chat-toggle]");
        const closeButton = document.getElementById("chat-close");
        const form = document.getElementById("chat-form");
        const input = document.getElementById("chat-input");
        const log = document.getElementById("chat-log");

        const togglePanel = () => {
          panel?.classList.toggle("hidden");
          if (!panel?.classList.contains("hidden")) {
            input?.focus();
          }
        };

        toggleButtons.forEach((btn) => btn.addEventListener("click", togglePanel));
        closeButton?.addEventListener("click", togglePanel);

        form?.addEventListener("submit", (event) => {
          event.preventDefault();
          const message = input?.value.trim();
          if (!message) return;

          const item = document.createElement("li");
          item.className = "flex justify-end";
          item.innerHTML = `<span class="max-w-[85%] rounded-2xl bg-orange-500 px-3 py-2 text-xs font-medium text-white">${message}</span>`;
          log?.appendChild(item);
          log?.scrollTo({ top: log.scrollHeight });
          input.value = "";

          setTimeout(() => {
            const reply = document.createElement("li");
            reply.className = "flex justify-start";
            reply.innerHTML = `<span class="max-w-[85%] rounded-2xl bg-gray-100 px-3 py-2 text-xs text-gray-700">Thanks! Our team will get back to you shortly.</span>`;
            log?.appendChild(reply);
            log?.scrollTo({ top: log.scrollHeight });
          }, 1200);
        });

        document.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && panel && !panel.classList.contains("hidden")) {
            panel.classList.add("hidden");
          }
        });
      })();
    </script>

    {% block extra_js %}{% endblock %}
  </body>
  </html>
